<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="content">
    <table id="table">
      <tr>
        <th>Book ID</th>
        <th>Book Name</th>
        <th>Author</th>
        <th>Pages</th>
        <th>Read Status</th>
      </tr>
    </table>
    <button class="add-button" commandfor="book-dialog" command="show-modal">Add Book</button>
    <dialog id="book-dialog">
      <form id="book-form">
        <legend>Add new book</legend>
        <p>
          <label for="book-name">Book name:</label>
          <input type="text" id="book-name" name="book-name" required >
        </p>
        <p>
          <label for="author">Author:</label>
          <input type="text" id="author" name="author" required>
        </p>
        <p>
          <label for="pages">Number of pages:</label>
          <input type="number" id="pages" name="pages" required>
        </p>
        <p>
          <label for="read-status">Did you read the book?</label>
          <select id="read-status" name="read">
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </p>
        <button class="form-submit" type="submit" form="book-form">Add Book</button>
      </form>
      <div class="dialog-buttons">
        <button class="form-cancel" commandfor="book-dialog" command="close">Cancel</button>
      </div>


    </dialog>
  </div>
  <script src="script.js"></script>
</body>
</html>
